blueprint:
  name: "Presence & TV Room Lighting"
  description: >
    Event-driven presence and TV lighting with no helper entities. New relevant
    events cancel the previous run and reconcile current state. Delays use
    sensor last_changed times, so TV/zone events do not extend an existing dwell
    or vacancy deadline. Home Assistant startup and presence recovery also reconcile state.

    Motion starts the dim scene. After sustained presence, select the TV scene
    if playback is already active, otherwise the day/night bright scene. TV
    playback changes retain their immediate/5-second-debounced behavior while
    lights are on. Leaving the couch pauses playback; an empty room always has
    priority over bright/TV scenes. Media-player errors do not stop lighting.

    Vacancy requires every configured presence entity to report exactly off:
    unknown, unavailable and missing entities never count as an empty room.
    Known vacancy dims/pauses after 2 seconds, then turns off at ramp-up dwell
    plus off-wait. These timers are recalculated from current state, not persisted
    across HA restarts. Optional TV/couch inputs may be left empty.
  homeassistant:
    min_version: 2023.8.0
  domain: automation
  source_url: https://github.com/l0rdsami/ha-blueprint-automation/blob/main/presence_tv_light.yaml

  input:
    presence_sensors:
      name: Presence / Motion Sensors
      description: >
        One or more presence or motion binary sensors (or groups). Any sensor
        switching to 'on' starts or restarts the lighting cycle.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - motion
            - domain: group
          multiple: true

    couch_sensor:
      name: Couch Presence Sensor (optional)
      description: >
        Presence sensor for the couch / sofa zone. Only used while TV mode is
        already active. Leaving the couch exits TV mode and pauses the TV.
        Leave empty to skip the couch check entirely (TV mode exits only when
        the TV stops or all presence clears).
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - motion
          multiple: false

    tv_entity:
      name: TV / Media Player (optional)
      description: >
        Media player entity for the room. TV mode is entered when the player
        reaches 'playing' state. Leave empty to disable TV mode entirely.
      default: ""
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: false

    dim_scene:
      name: Dim Scene
      description: >
        Scene for initial / dim lighting. Activated immediately on motion and
        again during wind-down. All light entities listed in this scene are
        used to determine which lights to turn off at the end of the cycle.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    bright_day_scene:
      name: Bright Day Scene
      description: >
        Scene for full-brightness lighting during daytime hours. Activated
        once presence has been sustained for the ramp-up dwell time and the
        current time falls within the day window.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    bright_night_scene:
      name: Bright Night Scene
      description: >
        Scene for full-brightness lighting during nighttime hours. Activated
        once presence has been sustained for the ramp-up dwell time and the
        current time is outside the day window.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    tv_scene:
      name: TV Scene (optional)
      description: >
        Scene activated when TV mode is entered. Leave empty to keep the
        current bright scene during TV playback.
      default: ""
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    ramp_up_wait:
      name: Ramp-up Dwell Time (seconds)
      description: >
        How long presence must be continuously detected before lights transition
        from dim to bright. The same duration is reused as the dim phase during
        wind-down before the off-wait begins.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: slider
          step: 1

    ramp_up_transition:
      name: Ramp-up Transition Time (seconds)
      description: >
        Transition duration when switching from dim to bright (and when
        returning from TV mode to bright).
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: slider
          step: 1

    off_wait:
      name: Off Wait Time (seconds)
      description: >
        Additional time to stay in dim mode after the wind-down dim phase
        elapses before turning the lights off.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: slider
          step: 1

    off_transition:
      name: Turn-off Transition Time (seconds)
      description: >
        Transition duration when turning the lights off.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: slider
          step: 1

    day_start:
      name: Day Mode Start Time
      description: >
        Start of the daytime window. The bright day scene is used between this
        time and the day mode end time. Set start later than end for an
        overnight day window (e.g. 20:00 → 06:00).
      default: "07:00:00"
      selector:
        time: {}

    day_end:
      name: Day Mode End Time
      description: >
        End of the daytime window. The bright night scene is used outside
        this window.
      default: "22:00:00"
      selector:
        time: {}

trigger_variables:
  _tv_entity: !input tv_entity
  _couch_sensor: !input couch_sensor

variables:
  presence_sensors: !input presence_sensors
  tv_entity: !input tv_entity
  couch_sensor: !input couch_sensor
  dim_scene: !input dim_scene
  bright_day_scene: !input bright_day_scene
  bright_night_scene: !input bright_night_scene
  tv_scene: !input tv_scene
  day_start: !input day_start
  day_end: !input day_end
  ramp_up_wait: !input ramp_up_wait
  off_wait: !input off_wait

trigger:
  # Include explicit off and availability recovery, without attribute-only noise.
  - platform: state
    entity_id: !input presence_sensors
    to: null
    id: presence
  - platform: homeassistant
    event: start
    id: startup
  # Templates keep genuinely optional entity selectors valid when left empty.
  - platform: template
    value_template: "{{ _tv_entity != '' and is_state(_tv_entity, 'playing') }}"
    id: tv_started
  - platform: template
    value_template: >
      {{ _tv_entity != ''
         and states(_tv_entity) not in ['playing', 'unknown', 'unavailable'] }}
    for:
      seconds: 5
    id: tv_stopped
  - platform: template
    value_template: "{{ _couch_sensor != '' and is_state(_couch_sensor, 'off') }}"
    for:
      seconds: 2
    id: couch_left

condition:
  # An irrelevant media event must not cancel a dim-scene call that has not yet
  # reported a light on. The occupied run will inspect current playback later.
  - condition: template
    value_template: >
      {{ trigger.id in ['presence', 'startup']
         or (state_attr(dim_scene, 'entity_id') | default([], true)
             | select('match', '^light\.') | map('states')
             | select('eq', 'on') | list | count > 0) }}
  - condition: template
    value_template: >
      {{ trigger.id != 'couch_left'
         or (tv_entity != '' and is_state(tv_entity, 'playing')
             and couch_sensor != '' and is_state(couch_sensor, 'off')) }}
  # Template triggers retain the state edge that started their native for timer.
  # Reject reconnects before entering the restart-mode script: an unavailable ->
  # paused/idle recovery must not cancel an occupied ramp or restore brightness.
  - condition: template
    value_template: >
      {{ trigger.id != 'tv_stopped'
         or (trigger.from_state is not none and trigger.from_state.state == 'playing') }}

action:
  - variables:
      linked_lights: >
        {{ state_attr(dim_scene, 'entity_id') | default([], true)
           | select('match', '^light\.') | list }}
      any_presence_on: >
        {{ presence_sensors | select('is_state', 'on') | list | count > 0 }}
      all_presence_off: >
        {{ presence_sensors | count > 0
           and presence_sensors | select('is_state', 'off') | list | count
               == presence_sensors | count }}
      lights_on: >
        {{ linked_lights | map('states') | select('eq', 'on') | list | count > 0 }}

  - if: "{{ not any_presence_on and not all_presence_off }}"
    then:
      - stop: "Presence is uncertain; cancel pending vacancy without issuing commands."

  # Empty-room handling has priority, including simultaneous couch/TV events.
  - if: "{{ all_presence_off }}"
    then:
      - variables:
          vacancy_age: >
            {% set ns = namespace(ages=[]) %}
            {% for e in presence_sensors %}
              {% set ns.ages = ns.ages + [as_timestamp(now()) - as_timestamp(states[e].last_changed)] %}
            {% endfor %}
            {{ ns.ages | min }}
      - delay:
          seconds: "{{ [0, ([2, (ramp_up_wait | float + off_wait | float)] | min) - vacancy_age | float] | max }}"
      - condition: template
        value_template: >
          {{ presence_sensors | count > 0
             and presence_sensors | select('is_state', 'off') | list | count
                 == presence_sensors | count }}
      - variables:
          vacancy_age: >
            {% set ns = namespace(ages=[]) %}
            {% for e in presence_sensors %}
              {% set ns.ages = ns.ages + [as_timestamp(now()) - as_timestamp(states[e].last_changed)] %}
            {% endfor %}
            {{ ns.ages | min }}
      # A short/zero off deadline must never be followed by a late dim command.
      - if: >
          {{ vacancy_age | float < ramp_up_wait | float + off_wait | float
             and linked_lights | map('states') | select('eq', 'on') | list | count > 0 }}
        then:
          - action: scene.turn_on
            target:
              entity_id: !input dim_scene
            data:
              transition: !input ramp_up_transition
      - if: >
          {{ vacancy_age | float >= 2
             and presence_sensors | select('is_state', 'off') | list | count == presence_sensors | count
             and tv_entity != '' and is_state(tv_entity, 'playing') }}
        then:
          - action: media_player.media_pause
            continue_on_error: true
            target:
              entity_id: "{{ tv_entity }}"
      - delay:
          seconds: >
            {% set ns = namespace(ages=[]) %}
            {% for e in presence_sensors %}
              {% set ns.ages = ns.ages + [as_timestamp(now()) - as_timestamp(states[e].last_changed)] %}
            {% endfor %}
            {{ [0, ramp_up_wait | float + off_wait | float - (ns.ages | min)] | max }}
      - condition: template
        value_template: >
          {{ presence_sensors | count > 0
             and presence_sensors | select('is_state', 'off') | list | count
                 == presence_sensors | count }}
      - if: "{{ linked_lights | count > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ linked_lights }}"
            data:
              transition: !input off_transition
      # Preserve short/zero light deadlines without losing the independent TV
      # debounce. Re-entry or uncertain presence cancels this restartable wait.
      - if: "{{ vacancy_age | float < 2 and tv_entity != '' }}"
        then:
          - delay:
              seconds: >
                {% set ns = namespace(ages=[]) %}
                {% for e in presence_sensors %}
                  {% set ns.ages = ns.ages + [as_timestamp(now()) - as_timestamp(states[e].last_changed)] %}
                {% endfor %}
                {{ [0, 2 - (ns.ages | min)] | max }}
          - condition: template
            value_template: >
              {{ presence_sensors | count > 0
                 and presence_sensors | select('is_state', 'off') | list | count
                     == presence_sensors | count }}
          - if: "{{ is_state(tv_entity, 'playing') }}"
            then:
              - action: media_player.media_pause
                continue_on_error: true
                target:
                  entity_id: "{{ tv_entity }}"
      - stop: "Known vacancy handled; never fall through to occupied scenes."

  - condition: template
    value_template: "{{ presence_sensors | select('is_state', 'on') | list | count > 0 }}"
  - if: "{{ not lights_on }}"
    then:
      - action: scene.turn_on
        target:
          entity_id: !input dim_scene

  - if: >
      {{ trigger.id == 'couch_left' and couch_sensor != ''
         and is_state(couch_sensor, 'off') and tv_entity != ''
         and is_state(tv_entity, 'playing') }}
    then:
      - action: media_player.media_pause
        continue_on_error: true
        target:
          entity_id: "{{ tv_entity }}"

  - variables:
      immediate_scene: >
        {{ lights_on and
           ((trigger.id == 'tv_started' and tv_entity != '' and is_state(tv_entity, 'playing'))
            or (trigger.id == 'tv_stopped' and tv_entity != ''
                and states(tv_entity) not in ['playing', 'unknown', 'unavailable'])
            or (trigger.id == 'couch_left' and couch_sensor != '' and is_state(couch_sensor, 'off'))) }}
  - if: "{{ not immediate_scene }}"
    then:
      - delay:
          seconds: >
            {% set ns = namespace(ages=[0]) %}
            {% for e in presence_sensors if is_state(e, 'on') %}
              {% set ns.ages = ns.ages + [as_timestamp(now()) - as_timestamp(states[e].last_changed)] %}
            {% endfor %}
            {{ [0, ramp_up_wait | float - (ns.ages | max)] | max }}

  # Inspect live presence/playback again after every cancellable dwell/service call.
  - condition: template
    value_template: "{{ presence_sensors | select('is_state', 'on') | list | count > 0 }}"
  - variables:
      bright_scene: >
        {%- set t = now().strftime('%H:%M:%S') -%}
        {%- if day_start <= day_end -%}
          {{- bright_day_scene if day_start <= t < day_end else bright_night_scene -}}
        {%- else -%}
          {{- bright_day_scene if t >= day_start or t < day_end else bright_night_scene -}}
        {%- endif -%}
      desired_scene: >
        {{ tv_scene if tv_scene != '' and tv_entity != '' and is_state(tv_entity, 'playing')
           and not (trigger.id == 'couch_left' and couch_sensor != '' and is_state(couch_sensor, 'off'))
           else bright_scene }}
  - action: scene.turn_on
    target:
      entity_id: "{{ desired_scene }}"
    data:
      transition: !input ramp_up_transition

# No parallel bright/dim writers or queue of stale scene decisions. Relevant state
# changes cancel a pending delay, and the new run recalculates its remaining time.
mode: restart
max_exceeded: silent
