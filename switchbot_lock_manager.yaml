blueprint:
  name: SwitchBot Lock Manager
  description: >
    Automatically manage a lock (e.g. SwitchBot) based on the presence of
    people. The door locks after a configurable delay once all tracked people
    have left home. When someone returns the door is unlocked (night-latch
    compatible – the bolt is retracted but the door is not physically opened),
    and the arriving person receives a persistent, actionable notification to
    open the door. The notification stays active for as long as the person
    remains home and is cleared automatically when they leave. An optional night
    mode prevents automatic unlocking during quiet hours so that arrivals must be
    manually approved by someone inside; it can also lock and unlock the door
    automatically at its start and end times. Optionally, everyone is sent an
    actionable "Lock" notification when the door stays unlocked during the
    night window; it is removed from all phones once the door is locked.

    The "Open Door" button survives Home Assistant restarts because it is
    handled by a dedicated event trigger, not a timed wait inside a run.

    Optional startup recovery rechecks away locking after restore states are
    available and uses a fresh auto-lock grace period. It is disabled by default
    and never unlocks or opens the door at startup. Recovery and departure waits
    run independently of immediate door controls and stop on an arrival or a
    locked door.

    Requires a custom notify script called script.notify_people that accepts the
    same arguments as a standard Home Assistant notify service (message, title,
    data). Add it to your scripts.yaml or configure it via the UI before using
    this blueprint.

    ---

    Steuert automatisch ein Schloss (z. B. SwitchBot) anhand der Anwesenheit
    von Personen. Die Tür sperrt nach einer einstellbaren Verzögerung, sobald
    alle verfolgten Personen das Haus verlassen haben. Bei Rückkehr wird die
    Tür entsperrt und die ankommende Person erhält eine persistente,
    interaktive Benachrichtigung. Ein optionaler Nachtmodus unterdrückt das
    automatische Entsperren während der Ruhezeiten.
  domain: automation
  source_url: https://github.com/l0rdsami/ha-blueprint-automation/blob/main/switchbot_lock_manager.yaml
  homeassistant:
    min_version: 2023.8.0

  input:
    lock_entity:
      name: Lock / Schloss
      description: >
        The lock entity to manage (e.g. your SwitchBot lock).
        | Die zu verwaltende Schloss-Entität (z. B. SwitchBot-Schloss).
      selector:
        entity:
          domain: lock

    people:
      name: People / Personen
      description: >
        People to track for presence. The door locks after the configured delay
        when all of them are away from home, and unlocks when any of them
        returns.
        | Zu überwachende Personen. Das Schloss sperrt nach der eingestellten
        Verzögerung, wenn alle abwesend sind, und entsperrt bei Rückkehr.
      selector:
        entity:
          domain: person
          multiple: true

    lock_delay:
      name: Auto-Lock Delay / Automatische Sperrzeit
      description: >
        Minutes to wait after all people have left before the door is locked
        automatically. Set to 0 to lock immediately.
        | Minuten, die gewartet werden, bevor die Tür automatisch gesperrt
        wird. 0 = sofort sperren.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min
          mode: slider

    restart_recovery_enabled:
      name: Recheck Away Locking After Restart / Abwesenheitssperre nach Neustart prüfen
      description: >
        Optional: after Home Assistant starts, wait for all tracked people and
        the lock to have valid states. If everyone is explicitly away and the
        lock is unlocked, wait the configured Auto-Lock Delay again, then
        recheck before locking. This starts a fresh grace period; it does not
        preserve the original departure deadline. It never unlocks or opens
        the door at startup. Disabled by default for existing installations.
        | Optional: Nach einem HA-Neustart auf gültige Zustände warten. Sind
        alle ausdrücklich abwesend und ist das Schloss unverriegelt, läuft
        die eingestellte Sperrzeit erneut. Danach wird vor dem Sperren erneut
        geprüft. Kein automatisches Entsperren/Öffnen beim Start.
      default: false
      selector:
        boolean:

    night_mode_enabled:
      name: Enable Night Mode / Nachtmodus aktivieren
      description: >
        When enabled: the door locks automatically at night mode start, unlocks
        at night mode end (if someone is home), and auto-unlock on arrival is
        suppressed during the night window. People at home still receive a
        notification during night mode and can open the door manually.
        | Wenn aktiviert: Tür sperrt automatisch zu Beginn des Nachtmodus,
        entsperrt am Ende (wenn jemand zu Hause ist), und automatisches
        Entsperren bei Ankunft wird unterdrückt. Personen zu Hause erhalten
        weiterhin eine Benachrichtigung und können die Tür manuell öffnen.
      default: false
      selector:
        boolean:

    night_mode_start:
      name: Night Mode Start / Nachtmodus Beginn
      description: >
        Time at which night mode begins. The door is locked automatically at
        this time and auto-unlock on arrival is disabled.
        | Uhrzeit, zu der der Nachtmodus beginnt. Die Tür wird automatisch
        gesperrt und das automatische Entsperren bei Ankunft deaktiviert.
      default: "22:00:00"
      selector:
        time:

    night_mode_end:
      name: Night Mode End / Nachtmodus Ende
      description: >
        Time at which night mode ends. The door is unlocked automatically at
        this time if at least one tracked person is home.
        | Uhrzeit, zu der der Nachtmodus endet. Die Tür wird automatisch
        entsperrt, wenn mindestens eine überwachte Person zu Hause ist.
      default: "07:00:00"
      selector:
        time:

    language:
      name: Language / Sprache
      description: >
        Language used for push notifications.
        | Sprache für Push-Benachrichtigungen.
      default: "de"
      selector:
        select:
          options:
            - label: "Deutsch (German)"
              value: "de"
            - label: "English"
              value: "en"

    notification_action_id:
      name: Notification Action ID / Benachrichtigungs-Aktions-ID
      description: >
        Action identifier used in the push notification button and the matching
        mobile_app_notification_action trigger.
        | Aktionskennung für den Push-Benachrichtigungsbutton und den
        passenden mobile_app_notification_action-Trigger.
      default: "OPEN_DOOR_NOW"
      selector:
        text:

    nfc_tag_id:
      name: NFC Tag ID / NFC-Tag-ID
      description: >
        NFC tag_id that is allowed to open the door. Leave empty to allow any
        scanned tag from allowed users.
        | Erlaubte NFC-tag_id zum Öffnen der Tür. Leer lassen, um jeden
        gescannten Tag von erlaubten Benutzern zuzulassen.
      default:
      selector:
        text:
          multiline: false

    unlocked_night_notify:
      name: Notify when unlocked at night / Benachrichtigen, wenn nachts nicht abgeschlossen
      description: >
        Send an actionable notification to all tracked people when the door is
        not locked during the night mode window (same start/end times as night
        mode) for the delay below. The notification has a "Lock" button and is
        removed from all phones as soon as the door is locked. If nobody is home,
        the door is locked automatically instead.
        | Sendet allen überwachten Personen eine interaktive Benachrichtigung,
        wenn die Tür im Nachtmodus-Zeitraum (gleiche Zeiten wie der Nachtmodus)
        länger als die unten eingestellte Zeit nicht abgeschlossen ist. Mit
        Button „Abschließen“; wird auf allen Handys gelöscht, sobald die Tür
        abgeschlossen ist. Ist niemand zu Hause, wird stattdessen automatisch
        abgeschlossen.
      default: false
      selector:
        boolean:

    unlocked_night_delay:
      name: Unlocked-at-night delay / Wartezeit nachts nicht abgeschlossen
      description: >
        Minutes the door must be unlocked during the night window before the
        notification is sent.
        | Minuten, die die Tür im Nachtzeitraum unverriegelt sein muss, bevor
        benachrichtigt wird.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: slider

    lock_action_id:
      name: Lock Action ID / Aktions-ID Abschließen
      description: >
        Action identifier of the "Lock" button in the unlocked-at-night
        notification.
        | Aktionskennung des Buttons „Abschließen“ in der Nacht-Benachrichtigung.
      default: "LOCK_DOOR_NOW"
      selector:
        text:

# Available in trigger templates (limited templates: inputs only).
trigger_variables:
  tv_lock_entity: !input lock_entity
  tv_night_start: !input night_mode_start
  tv_night_end: !input night_mode_end
  tv_unlocked_night_notify: !input unlocked_night_notify

variables:
  lock_entity: !input lock_entity
  people: !input people
  lock_delay: !input lock_delay
  restart_recovery_enabled: !input restart_recovery_enabled
  night_mode_enabled: !input night_mode_enabled
  night_mode_start: !input night_mode_start
  night_mode_end: !input night_mode_end
  notification_action_id: !input notification_action_id
  nfc_tag_id: !input nfc_tag_id
  language: !input language
  unlocked_night_delay: !input unlocked_night_delay
  lock_action_id: !input lock_action_id

trigger:
  - platform: homeassistant
    event: start
    id: startup_away_recovery
  # Only real arrivals and departures dispatch presence actions; intermediate
  # GPS/zone transitions do not create another auto-lock countdown.
  - platform: state
    entity_id: !input people
    to: "home"
    id: arrived_home
  - platform: state
    entity_id: !input people
    from: "home"
    id: left_home
  - platform: time
    at: !input night_mode_start
    id: night_mode_start
  - platform: time
    at: !input night_mode_end
    id: night_mode_end
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: !input notification_action_id
    id: open_door_action
#   - trigger: tag
#     tag_id: !input nfc_tag_id
  - platform: event
    event_type: tag_scanned
    event_data:
      tag_id: !input nfc_tag_id
    id: nfc_tag_scanned
  # Door not locked inside the night window for the configured delay.
  # The template re-renders every minute (now()), so this also fires when the
  # door was already unlocked before the window started (e.g. the automatic
  # lock at night mode start failed).
  - platform: template
    value_template: >
      {% if not tv_unlocked_night_notify %}
        {{ false }}
      {% else %}
        {% set t = now().strftime('%H:%M:%S') %}
        {% if tv_night_start <= tv_night_end %}
          {% set night = tv_night_start <= t < tv_night_end %}
        {% else %}
          {% set night = t >= tv_night_start or t < tv_night_end %}
        {% endif %}
        {{ night and states(tv_lock_entity) in ['unlocked', 'open', 'jammed'] }}
      {% endif %}
    for:
      minutes: !input unlocked_night_delay
    id: unlocked_at_night
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: !input lock_action_id
    id: lock_door_action
  - platform: state
    entity_id: !input lock_entity
    to: "locked"
    id: door_locked

condition: []

action:
  - variables:
      triggered_person: "{{ trigger.entity_id if trigger.entity_id is defined else '' }}"
      trigger_user_id: "{{ trigger.event.context.user_id if trigger.event is defined and trigger.event.context is defined else '' }}"
      is_allowed_user: >
        {% set ns = namespace(allowed=false) %}
        {% for p in people %}
          {% if state_attr(p, 'user_id') == trigger_user_id %}
            {% set ns.allowed = true %}
          {% endif %}
        {% endfor %}
        {{ ns.allowed }}
      # True when nobody from the tracked list is home.
      # Computed directly with a namespace to avoid the string-length trap:
      # rendering a Jinja2 list with {{ ns.result }} produces a string like
      # "['person.john']", and then `| length` returns the string length
      # (always > 0), making every derived boolean incorrect.{{ trigger.event.context.user_id }}
      all_away: >
        {% set ns = namespace(all_away=true) %}
        {% for p in people %}
          {% if is_state(p, 'home') %}
            {% set ns.all_away = false %}
          {% endif %}
        {% endfor %}
        {{ ns.all_away }}
      # Use {{ false }} / {{ true }} so Home Assistant stores a proper Python
      # bool, not the literal string "false" which is evaluated as True
      # (non-empty string) in Jinja2 and would break every condition that
      # checks `not (is_night_mode | bool)`.
      is_night_mode: >
        {% if not night_mode_enabled %}
          {{ false }}
        {% else %}
          {# Time strings are zero-padded HH:MM:SS, so lexicographic comparison
             is equivalent to chronological comparison for 24-hour clock values. #}
          {% set t = now().strftime('%H:%M:%S') %}
          {% if night_mode_start <= night_mode_end %}
            {{ night_mode_start <= t < night_mode_end }}
          {% else %}
            {{ t >= night_mode_start or t < night_mode_end }}
          {% endif %}
        {% endif %}
      triggered_name: >
        {% if triggered_person %}
          {{ state_attr(triggered_person, 'friendly_name') | default(triggered_person, true) }}
        {% else %}
          time_trigger
        {% endif %}
      # ── Localized notification strings ────────────────────────────────────
      notif_title: >
        {% if language == 'de' %}
          {{ triggered_name }} ist zu Hause
        {% else %}
          {{ triggered_name }} is home
        {% endif %}
      notif_message: >
        {% if language == 'de' %}
          {{ triggered_name }} ist gerade nach Hause gekommen.
          {%- if is_night_mode | bool %} Nachtmodus ist aktiv – die Tür wurde nicht automatisch entsperrt.{%- endif %}
          Tür jetzt öffnen?
        {% else %}
          {{ triggered_name }} just arrived.
          {%- if is_night_mode | bool %} Night mode is active – the door was not unlocked automatically.{%- endif %}
          Open the door now?
        {% endif %}
      notif_action_title: >
        {% if language == 'de' %}
          Tür öffnen
        {% else %}
          Open Door
        {% endif %}
      lock_name: "{{ state_attr(lock_entity, 'friendly_name') | default(lock_entity, true) }}"
      night_title: >
        {% if language == 'de' %}
          Tür nicht abgeschlossen
        {% else %}
          Door not locked
        {% endif %}
      night_message: >
        {% if language == 'de' %}
          {{ lock_name }} ist seit {{ unlocked_night_delay | int }} Minuten nicht abgeschlossen.
        {% else %}
          {{ lock_name }} has not been locked for {{ unlocked_night_delay | int }} minutes.
        {% endif %}
      night_action_title: >
        {% if language == 'de' %}
          Abschließen
        {% else %}
          Lock
        {% endif %}

  - choose:
      # Startup can have incomplete restore states; never treat those as away.
      # Only this opt-in branch uses strict recovery checks. Existing arrival,
      # departure, night and authorized notification/NFC actions remain here.
      # Parallel runs keep unrelated no-op events from discarding this wait.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'startup_away_recovery' and restart_recovery_enabled }}"
        sequence:
          - condition: template
            value_template: "{{ people | length > 0 }}"
          - wait_template: >-
              {% set ns = namespace(ready=true, home=false) %}
              {% for person in people %}
                {% if is_state(person, 'home') %}
                  {% set ns.home = true %}
                {% endif %}
                {% if states(person) in ['unknown', 'unavailable', ''] %}
                  {% set ns.ready = false %}
                {% endif %}
              {% endfor %}
              {{ ns.home or (ns.ready and states(lock_entity) in ['locked', 'unlocked']) }}
          - alias: Recover only with known away people and an unlocked lock
            condition: template
            value_template: >-
              {% set ns = namespace(away=people | length > 0) %}
              {% for person in people %}
                {% if states(person) in ['home', 'unknown', 'unavailable', ''] %}
                  {% set ns.away = false %}
                {% endif %}
              {% endfor %}
              {{ ns.away and is_state(lock_entity, 'unlocked') }}
          # An arrival or a locked door cancels this countdown permanently,
          # even if the person leaves or the door unlocks again before expiry.
          - wait_for_trigger:
              - platform: state
                entity_id: !input people
                to: "home"
              - platform: state
                entity_id: !input lock_entity
                to: "locked"
            timeout:
              minutes: "{{ lock_delay | int }}"
            continue_on_timeout: true
          - condition: template
            value_template: "{{ not wait.completed }}"
          - alias: Recheck current states after the recovery grace period
            condition: template
            value_template: >-
              {% set ns = namespace(away=people | length > 0) %}
              {% for person in people %}
                {% if states(person) in ['home', 'unknown', 'unavailable', ''] %}
                  {% set ns.away = false %}
                {% endif %}
              {% endfor %}
              {{ ns.away and is_state(lock_entity, 'unlocked') }}
          - action: lock.lock
            target:
              entity_id: "{{ lock_entity }}"

      # ── Someone arrived home ─────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'arrived_home' }}"
        sequence:
          # Unlock the door unless night mode is active
          - if:
              - condition: template
                value_template: "{{ not (is_night_mode | bool) }}"
            then:
              - action: lock.unlock
                target:
                  entity_id: "{{ lock_entity }}"

          # Notify only the person who just arrived home with a persistent,
          # actionable notification. The "Open Door" button is handled by the
          # open_door_action trigger so it works at any time, including after a
          # Home Assistant restart.
          - action: script.notify_people
            data:
              persons:
                - "{{ triggered_person }}"
              title: "{{ notif_title }}"
              message: "{{ notif_message }}"
              data:
                sticky: true
                persistent: true
                tag: door_arrival_notification
                actions:
                  - action: "{{ notification_action_id }}"
                    title: "{{ notif_action_title }}"

      # ── Someone left home ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'left_home' }}"
        sequence:
          # Dismiss the arrival notification only for the person who left
          - action: script.notify_people
            data:
              persons:
                - "{{ triggered_person }}"
              message: "clear_notification"
              data:
                tag: door_arrival_notification

          # Start the auto-lock timer only when all people are now away
          - if:
              - condition: template
                value_template: "{{ all_away | bool }}"
            then:
              # An arrival or a locked door cancels this countdown permanently,
              # even if the person leaves or the door unlocks again before expiry.
              - wait_for_trigger:
                  - platform: state
                    entity_id: !input people
                    to: "home"
                  - platform: state
                    entity_id: !input lock_entity
                    to: "locked"
                timeout:
                  minutes: "{{ lock_delay | int }}"
                continue_on_timeout: true
              - condition: template
                value_template: "{{ not wait.completed }}"

              # Re-check: only lock if everyone is still away after the delay
              - variables:
                  still_all_away: >
                    {% set ns = namespace(away=true) %}
                    {% for p in people %}
                      {% if is_state(p, 'home') %}
                        {% set ns.away = false %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.away }}

              - if:
                  - condition: template
                    value_template: "{{ still_all_away | bool }}"
                then:
                  - action: lock.lock
                    target:
                      entity_id: "{{ lock_entity }}"

      # ── Night mode started – lock the door ───────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'night_mode_start' and night_mode_enabled }}"
        sequence:
          - action: lock.lock
            target:
              entity_id: "{{ lock_entity }}"

      # ── Night mode ended – unlock if someone is home ──────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'night_mode_end' and night_mode_enabled and not (all_away | bool) }}"
        sequence:
          - action: lock.unlock
            target:
              entity_id: "{{ lock_entity }}"

      # ── "Open Door" button tapped in notification ────────────────────────
      # Handled as an event trigger so it works at any time, including after
      # a Home Assistant restart (no wait_for_trigger state to lose).
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'open_door_action' and (is_allowed_user | bool) }}"
        sequence:
          - action: lock.open
            target:
              entity_id: "{{ lock_entity }}"

      # ── Allowed NFC tag scanned ─────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'nfc_tag_scanned' and (is_allowed_user | bool) }}"
        sequence:
          - action: lock.open
            target:
              entity_id: "{{ lock_entity }}"

      # ── Door not locked at night ─────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'unlocked_at_night' }}"
        sequence:
          - if:
              # Nobody home: lock immediately under the existing night policy.
              # The locked-state event also ends any pending away countdown.
              - condition: template
                value_template: "{{ all_away | bool }}"
            then:
              - action: lock.lock
                target:
                  entity_id: "{{ lock_entity }}"
            else:
              - action: script.notify_people
                data:
                  persons: "{{ people }}"
                  title: "{{ night_title }}"
                  message: "{{ night_message }}"
                  data:
                    tag: door_unlocked_night
                    sticky: true
                    persistent: true
                    actions:
                      - action: "{{ lock_action_id }}"
                        title: "{{ night_action_title }}"

      # ── "Lock" button tapped in the night notification ───────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'lock_door_action' and (is_allowed_user | bool) }}"
        sequence:
          - action: lock.lock
            target:
              entity_id: "{{ lock_entity }}"

      # ── Door locked: remove the night notification from every phone ─────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'door_locked' }}"
        sequence:
          - action: script.notify_people
            data:
              persons: "{{ people }}"
              message: "clear_notification"
              data:
                tag: door_unlocked_night

# Long away waits must not queue arrivals or be restarted by unrelated events.
# Each wait cancels itself on arrival/locked and rechecks before locking.
mode: parallel
max: 10
max_exceeded: silent
