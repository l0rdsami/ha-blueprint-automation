blueprint:
  name: Presence & TV Room Lighting
  description: >
    Event-driven presence and TV lighting with no helper entities.


    Scenes are only applied on transitions, so manual adjustments stay until the
    next real change: lights off → dim on arrival, dim → bright (or TV scene) after
    sustained presence, TV start/stop, leaving the couch during playback, vacancy
    (dim, pause TV, then off) and the day/night switch (slow transition, only while
    in bright mode).


    A short dropout (room empty for at least 2 s but less than the ramp-up dwell)
    restores the previous scene immediately when presence returns. A longer one
    stays dim until presence has been sustained for the dwell again.


    Vacancy requires every presence entity to report exactly 'off': unknown,
    unavailable and missing entities never count as an empty room. Buffering does
    not count as the TV stopping. Media-player errors do not stop lighting.
    Optional TV/couch inputs may be left empty.
  homeassistant:
    min_version: 2024.8.0
  domain: automation
  source_url: https://github.com/l0rdsami/ha-blueprint-automation/blob/main/presence_tv_light.yaml
  input:
    presence_sensors:
      name: Presence / Motion Sensors
      description: One or more presence or motion binary sensors (or groups).
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: [occupancy, motion]
            - domain: group
          multiple: true
    couch_sensor:
      name: Couch Presence Sensor (optional)
      description: >
        Couch / sofa zone. Only used while the TV is playing: leaving the couch
        pauses the TV and switches to the bright scene.
      default: ''
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: [occupancy, motion]
    tv_entity:
      name: TV / Media Player (optional)
      description: Media player for the room. Leave empty to disable TV mode.
      default: ''
      selector:
        entity:
          filter:
            - domain: media_player
    dim_scene:
      name: Dim Scene
      description: >
        Scene on arrival and during vacancy. Its light entities are the lights
        this automation manages (checked for on/off and turned off at the end).
      selector:
        entity:
          filter:
            - domain: scene
    bright_day_scene:
      name: Bright Day Scene
      selector:
        entity:
          filter:
            - domain: scene
    bright_night_scene:
      name: Bright Night Scene
      selector:
        entity:
          filter:
            - domain: scene
    tv_scene:
      name: TV Scene (optional)
      description: Scene while the TV is playing. Leave empty to keep the bright scene.
      default: ''
      selector:
        entity:
          filter:
            - domain: scene
    ramp_up_wait:
      name: Ramp-up Dwell Time (seconds)
      description: >
        How long presence must be sustained before dim → bright. Also the dim phase
        during vacancy before the off-wait starts, and the limit for a "short
        dropout" that restores the scene immediately.
      default: 60
      selector:
        number: {min: 0, max: 3600, step: 1, unit_of_measurement: s, mode: slider}
    ramp_up_transition:
      name: Ramp-up Transition Time (seconds)
      description: Transition into the bright / TV scene.
      default: 5
      selector:
        number: {min: 0, max: 60, step: 1, unit_of_measurement: s, mode: slider}
    vacancy_dim_transition:
      name: Vacancy Dim Transition Time (seconds)
      description: Transition into the dim scene when the room becomes empty.
      default: 5
      selector:
        number: {min: 0, max: 60, step: 1, unit_of_measurement: s, mode: slider}
    off_wait:
      name: Off Wait Time (seconds)
      description: Extra time in dim after the vacancy dim phase before turning off.
      default: 60
      selector:
        number: {min: 0, max: 3600, step: 1, unit_of_measurement: s, mode: slider}
    off_transition:
      name: Turn-off Transition Time (seconds)
      default: 5
      selector:
        number: {min: 0, max: 60, step: 1, unit_of_measurement: s, mode: slider}
    day_start:
      name: Day Mode Start Time
      description: >
        Start of the day window (bright day scene). Start later than end gives an
        overnight window.
      default: '07:00:00'
      selector:
        time: {}
    day_end:
      name: Day Mode End Time
      default: '22:00:00'
      selector:
        time: {}
    day_night_transition:
      name: Day/Night Switch Transition Time (seconds)
      description: >
        Transition used when the bright scene changes at day start / day end while
        the lights are already bright.
      default: 900
      selector:
        number: {min: 0, max: 3600, step: 10, unit_of_measurement: s, mode: slider}

trigger_variables:
  _tv_entity: !input tv_entity
  _couch_sensor: !input couch_sensor

variables:
  presence_sensors: !input presence_sensors
  tv_entity: !input tv_entity
  couch_sensor: !input couch_sensor
  dim_scene: !input dim_scene
  bright_day_scene: !input bright_day_scene
  bright_night_scene: !input bright_night_scene
  tv_scene: !input tv_scene
  day_start: !input day_start
  day_end: !input day_end
  ramp_up_wait: !input ramp_up_wait
  off_wait: !input off_wait

trigger:
  - platform: state
    entity_id: !input presence_sensors
    to: ~
    id: presence
  - platform: state
    entity_id: !input presence_sensors
    to: 'on'
    for:
      seconds: !input ramp_up_wait
    id: ramp_up_done
  - platform: homeassistant
    event: start
    id: startup
  - platform: template
    value_template: "{{ _tv_entity != '' and is_state(_tv_entity, 'playing') }}"
    id: tv_started
  - platform: template
    value_template: >
      {{ _tv_entity != '' and states(_tv_entity)
         not in ['playing', 'buffering', 'unknown', 'unavailable'] }}
    for:
      seconds: 5
    id: tv_stopped
  - platform: template
    value_template: "{{ _couch_sensor != '' and is_state(_couch_sensor, 'off') }}"
    for:
      seconds: 2
    id: couch_left
  - platform: time
    at: !input day_start
    id: day_switch
  - platform: time
    at: !input day_end
    id: day_switch

condition:
  # Anything but arrival/startup only matters while the lights are on.
  - condition: template
    value_template: >
      {{ trigger.id in ['presence', 'startup']
         or (state_attr(dim_scene, 'entity_id') | default([], true)
             | select('match', '^light\.') | select('is_state', 'on') | list | count > 0) }}
  - condition: template
    value_template: >
      {{ trigger.id != 'couch_left'
         or (tv_entity != '' and is_state(tv_entity, 'playing')
             and couch_sensor != '' and is_state(couch_sensor, 'off')) }}
  - condition: template
    value_template: >
      {{ trigger.id != 'tv_stopped'
         or (trigger.from_state is not none
             and trigger.from_state.state in ['playing', 'buffering']) }}

action:
  - variables:
      linked_lights: >
        {{ state_attr(dim_scene, 'entity_id') | default([], true)
           | select('match', '^light\.') | list }}
      lights_on: "{{ linked_lights | select('is_state', 'on') | list | count > 0 }}"
      any_presence_on: "{{ presence_sensors | select('is_state', 'on') | list | count > 0 }}"
      all_presence_off: >
        {{ presence_sensors | count > 0 and
           presence_sensors | select('is_state', 'off') | list | count == presence_sensors | count }}

  - if: "{{ not any_presence_on and not all_presence_off }}"
    then:
      - stop: Presence is uncertain; cancel pending vacancy without issuing commands.

  # ── VACANCY ──────────────────────────────────────────────────────────────────
  # Any presence change restarts this run, so the room stays empty while it waits.
  - if: "{{ all_presence_off }}"
    then:
      - variables:
          vacant_since: >
            {% set ns = namespace(t=0) %}
            {% for e in presence_sensors %}
              {% set ns.t = [ns.t, as_timestamp(states[e].last_changed)] | max %}
            {% endfor %}
            {{ ns.t }}
          off_after: "{{ ramp_up_wait | float + off_wait | float }}"
      - delay:
          seconds: "{{ [0, [2, off_after | float] | min - (as_timestamp(now()) - vacant_since | float)] | max }}"
      - if: "{{ as_timestamp(now()) - vacant_since | float < off_after | float
                and linked_lights | select('is_state', 'on') | list | count > 0 }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: !input dim_scene
            data:
              transition: !input vacancy_dim_transition
      - if: "{{ as_timestamp(now()) - vacant_since | float >= 2
                and tv_entity != '' and is_state(tv_entity, 'playing') }}"
        then:
          - action: media_player.media_pause
            continue_on_error: true
            target:
              entity_id: "{{ tv_entity }}"
      - delay:
          seconds: "{{ [0, off_after | float - (as_timestamp(now()) - vacant_since | float)] | max }}"
      - if: "{{ linked_lights | count > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ linked_lights }}"
            data:
              transition: !input off_transition
      # Off deadline under 2 s: still give the TV its 2 s before pausing.
      - if: "{{ tv_entity != '' and is_state(tv_entity, 'playing') }}"
        then:
          - delay:
              seconds: "{{ [0, 2 - (as_timestamp(now()) - vacant_since | float)] | max }}"
          - action: media_player.media_pause
            continue_on_error: true
            target:
              entity_id: "{{ tv_entity }}"
      - stop: Vacancy handled.

  # ── OCCUPIED ─────────────────────────────────────────────────────────────────
  - variables:
      bright_scene: >-
        {%- set t = now().strftime('%H:%M:%S') -%}
        {%- if day_start <= day_end -%}
          {{- bright_day_scene if day_start <= t < day_end else bright_night_scene -}}
        {%- else -%}
          {{- bright_day_scene if t >= day_start or t < day_end else bright_night_scene -}}
        {%- endif -%}
      tv_mode: "{{ tv_scene != '' and tv_entity != '' and is_state(tv_entity, 'playing') }}"
      desired_scene: "{{ tv_scene if tv_mode else bright_scene }}"
      # Seconds since the longest-present sensor turned on.
      presence_age: >
        {% set ns = namespace(t=as_timestamp(now())) %}
        {% for e in presence_sensors if is_state(e, 'on') %}
          {% set ns.t = [ns.t, as_timestamp(states[e].last_changed)] | min %}
        {% endfor %}
        {{ as_timestamp(now()) - ns.t }}
      # For presence / ramp_up_done: how long the room was empty before this
      # sensor turned on (0 when another sensor was still on, or no clean off→on).
      vacancy_len: >
        {% if trigger.id in ['presence', 'ramp_up_done']
              and trigger.from_state is not none and trigger.to_state is not none
              and trigger.from_state.state == 'off' and trigger.to_state.state == 'on' %}
          {% set start = as_timestamp(trigger.to_state.last_changed) %}
          {% set ns = namespace(since=as_timestamp(trigger.from_state.last_changed), vacant=true) %}
          {% for e in presence_sensors if e != trigger.entity_id and states[e] is not none %}
            {% set lc = as_timestamp(states[e].last_changed) %}
            {% if lc < start %}
              {% if is_state(e, 'off') %}{% set ns.since = [ns.since, lc] | max %}
              {% else %}{% set ns.vacant = false %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ (start - ns.since) if ns.vacant else 0 }}
        {% else %}0{% endif %}

  - choose:
      # Arrival or presence change.
      - conditions: "{{ trigger.id == 'presence' }}"
        sequence:
          - if: "{{ not lights_on }}"
            then:
              # Off → dim; ramp_up_done brightens after the dwell.
              - action: scene.turn_on
                target:
                  entity_id: !input dim_scene
            else:
              # Short dropout: the vacancy dim ran, restore right away.
              - if: "{{ 2 <= vacancy_len | float < ramp_up_wait | float }}"
                then:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ desired_scene }}"
                    data:
                      transition: !input ramp_up_transition

      # Dim → bright after sustained presence. Only when this presence period
      # started dim: the lights came on with it, or it followed a long vacancy.
      - conditions: "{{ trigger.id == 'ramp_up_done' }}"
        sequence:
          - condition: template
            value_template: >
              {% set start = as_timestamp(trigger.to_state.last_changed) %}
              {% set ns = namespace(t=0) %}
              {% for e in linked_lights if is_state(e, 'on') %}
                {% set ns.t = [ns.t, as_timestamp(states[e].last_changed)] | max %}
              {% endfor %}
              {{ ns.t >= start - 2 or vacancy_len | float >= ramp_up_wait | float }}
          - action: scene.turn_on
            target:
              entity_id: "{{ desired_scene }}"
            data:
              transition: !input ramp_up_transition

      # HA restart: reconcile from current state.
      - conditions: "{{ trigger.id == 'startup' }}"
        sequence:
          - if: "{{ not lights_on }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: !input dim_scene
          - delay:
              seconds: "{{ [0, ramp_up_wait | float - presence_age | float] | max }}"
          - action: scene.turn_on
            target:
              entity_id: "{{ desired_scene }}"
            data:
              transition: !input ramp_up_transition

      # TV started / stopped (lights are on).
      - conditions: "{{ trigger.id in ['tv_started', 'tv_stopped'] and tv_scene != '' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ desired_scene }}"
            data:
              transition: !input ramp_up_transition

      # Left the couch during playback.
      - conditions: "{{ trigger.id == 'couch_left' }}"
        sequence:
          - action: media_player.media_pause
            continue_on_error: true
            target:
              entity_id: "{{ tv_entity }}"
          - if: "{{ tv_scene != '' }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ bright_scene }}"
                data:
                  transition: !input ramp_up_transition

      # Day/night boundary: only in bright mode, not while still in the dim dwell.
      - conditions: >
          {{ trigger.id == 'day_switch' and not tv_mode
             and presence_age | float >= ramp_up_wait | float }}
        sequence:
          - action: scene.turn_on
            target:
              entity_id: "{{ bright_scene }}"
            data:
              transition: !input day_night_transition

mode: restart
max_exceeded: silent
