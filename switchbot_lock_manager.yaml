blueprint:
  name: SwitchBot Lock Manager
  description: >
    Automatically manage a lock (e.g. SwitchBot) based on the presence of
    people. The door locks after a configurable delay once all tracked people
    have left home. When someone returns the door is unlocked (night-latch
    compatible – the bolt is retracted but the door is not physically opened),
    and the arriving person receives a persistent, actionable notification to
    open the door. The notification stays active for as long as the person
    remains home and is cleared automatically when they leave. An optional night
    mode prevents automatic unlocking during quiet hours so that arrivals must be
    manually approved by someone inside; it can also lock and unlock the door
    automatically at its start and end times.

    The "Open Door" button survives Home Assistant restarts because it is
    handled by a dedicated event trigger, not a timed wait inside a run.

    Requires a custom notify script called script.notify_people that accepts the
    same arguments as a standard Home Assistant notify service (message, title,
    data). Add it to your scripts.yaml or configure it via the UI before using
    this blueprint.

    ---

    Steuert automatisch ein Schloss (z. B. SwitchBot) anhand der Anwesenheit
    von Personen. Die Tür sperrt nach einer einstellbaren Verzögerung, sobald
    alle verfolgten Personen das Haus verlassen haben. Bei Rückkehr wird die
    Tür entsperrt und die ankommende Person erhält eine persistente,
    interaktive Benachrichtigung. Ein optionaler Nachtmodus unterdrückt das
    automatische Entsperren während der Ruhezeiten.
  domain: automation
  source_url: https://github.com/l0rdsami/ha-blueprint-automation/blob/main/switchbot_lock_manager.yaml
  homeassistant:
    min_version: 2023.8.0

  input:
    lock_entity:
      name: Lock / Schloss
      description: >
        The lock entity to manage (e.g. your SwitchBot lock).
        | Die zu verwaltende Schloss-Entität (z. B. SwitchBot-Schloss).
      selector:
        entity:
          domain: lock

    people:
      name: People / Personen
      description: >
        People to track for presence. The door locks after the configured delay
        when all of them are away from home, and unlocks when any of them
        returns.
        | Zu überwachende Personen. Das Schloss sperrt nach der eingestellten
        Verzögerung, wenn alle abwesend sind, und entsperrt bei Rückkehr.
      selector:
        entity:
          domain: person
          multiple: true

    lock_delay:
      name: Auto-Lock Delay / Automatische Sperrzeit
      description: >
        Minutes to wait after all people have left before the door is locked
        automatically. Set to 0 to lock immediately.
        | Minuten, die gewartet werden, bevor die Tür automatisch gesperrt
        wird. 0 = sofort sperren.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min
          mode: slider

    night_mode_enabled:
      name: Enable Night Mode / Nachtmodus aktivieren
      description: >
        When enabled: the door locks automatically at night mode start, unlocks
        at night mode end (if someone is home), and auto-unlock on arrival is
        suppressed during the night window. People at home still receive a
        notification during night mode and can open the door manually.
        | Wenn aktiviert: Tür sperrt automatisch zu Beginn des Nachtmodus,
        entsperrt am Ende (wenn jemand zu Hause ist), und automatisches
        Entsperren bei Ankunft wird unterdrückt. Personen zu Hause erhalten
        weiterhin eine Benachrichtigung und können die Tür manuell öffnen.
      default: false
      selector:
        boolean:

    night_mode_start:
      name: Night Mode Start / Nachtmodus Beginn
      description: >
        Time at which night mode begins. The door is locked automatically at
        this time and auto-unlock on arrival is disabled.
        | Uhrzeit, zu der der Nachtmodus beginnt. Die Tür wird automatisch
        gesperrt und das automatische Entsperren bei Ankunft deaktiviert.
      default: "22:00:00"
      selector:
        time:

    night_mode_end:
      name: Night Mode End / Nachtmodus Ende
      description: >
        Time at which night mode ends. The door is unlocked automatically at
        this time if at least one tracked person is home.
        | Uhrzeit, zu der der Nachtmodus endet. Die Tür wird automatisch
        entsperrt, wenn mindestens eine überwachte Person zu Hause ist.
      default: "07:00:00"
      selector:
        time:

    language:
      name: Language / Sprache
      description: >
        Language used for push notifications.
        | Sprache für Push-Benachrichtigungen.
      default: "de"
      selector:
        select:
          options:
            - label: "Deutsch (German)"
              value: "de"
            - label: "English"
              value: "en"

variables:
  lock_entity: !input lock_entity
  people: !input people
  lock_delay: !input lock_delay
  night_mode_enabled: !input night_mode_enabled
  night_mode_start: !input night_mode_start
  night_mode_end: !input night_mode_end
  language: !input language

trigger:
  # Split into two precise triggers so that intermediate GPS state changes
  # (e.g. not_home → away → not_home) never fire the automation and cannot
  # cancel a running lock-delay.
  - platform: state
    entity_id: !input people
    to: "home"
    id: arrived_home
  - platform: state
    entity_id: !input people
    from: "home"
    id: left_home
  - platform: time
    at: !input night_mode_start
    id: night_mode_start
  - platform: time
    at: !input night_mode_end
    id: night_mode_end
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: OPEN_DOOR_NOW
    id: open_door_action

condition: []

action:
  - variables:
      triggered_person: "{{ trigger.entity_id if trigger.entity_id is defined else '' }}"
      # True when nobody from the tracked list is home.
      # Computed directly with a namespace to avoid the string-length trap:
      # rendering a Jinja2 list with {{ ns.result }} produces a string like
      # "['person.john']", and then `| length` returns the string length
      # (always > 0), making every derived boolean incorrect.
      all_away: >
        {% set ns = namespace(all_away=true) %}
        {% for p in people %}
          {% if is_state(p, 'home') %}
            {% set ns.all_away = false %}
          {% endif %}
        {% endfor %}
        {{ ns.all_away }}
      # Use {{ false }} / {{ true }} so Home Assistant stores a proper Python
      # bool, not the literal string "false" which is evaluated as True
      # (non-empty string) in Jinja2 and would break every condition that
      # checks `not (is_night_mode | bool)`.
      is_night_mode: >
        {% if not night_mode_enabled %}
          {{ false }}
        {% else %}
          {# Time strings are zero-padded HH:MM:SS, so lexicographic comparison
             is equivalent to chronological comparison for 24-hour clock values. #}
          {% set t = now().strftime('%H:%M:%S') %}
          {% if night_mode_start <= night_mode_end %}
            {{ night_mode_start <= t < night_mode_end }}
          {% else %}
            {{ t >= night_mode_start or t < night_mode_end }}
          {% endif %}
        {% endif %}
      triggered_name: >
        {% if triggered_person %}
          {{ state_attr(triggered_person, 'friendly_name') | default(triggered_person, true) }}
        {% else %}
          time_trigger
        {% endif %}
      # ── Localized notification strings ────────────────────────────────────
      notif_title: >
        {% if language == 'de' %}
          {{ triggered_name }} ist zu Hause
        {% else %}
          {{ triggered_name }} is home
        {% endif %}
      notif_message: >
        {% if language == 'de' %}
          {{ triggered_name }} ist gerade nach Hause gekommen.
          {%- if is_night_mode | bool %} Nachtmodus ist aktiv – die Tür wurde nicht automatisch entsperrt.{%- endif %}
          Tür jetzt öffnen?
        {% else %}
          {{ triggered_name }} just arrived.
          {%- if is_night_mode | bool %} Night mode is active – the door was not unlocked automatically.{%- endif %}
          Open the door now?
        {% endif %}
      notif_action_title: >
        {% if language == 'de' %}
          Tür öffnen
        {% else %}
          Open Door
        {% endif %}

  - choose:
      # ── Someone arrived home ─────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'arrived_home' }}"
        sequence:
          # Unlock the door unless night mode is active
          - if:
              - condition: template
                value_template: "{{ not (is_night_mode | bool) }}"
            then:
              - action: lock.unlock
                target:
                  entity_id: "{{ lock_entity }}"

          # Notify only the person who just arrived home with a persistent,
          # actionable notification. The "Open Door" button is handled by the
          # open_door_action trigger so it works at any time, including after a
          # Home Assistant restart.
          - action: script.notify_people
            data:
              persons:
                - "{{ triggered_person }}"
              title: "{{ notif_title }}"
              message: "{{ notif_message }}"
              data:
                sticky: true
                persistent: true
                tag: door_arrival_notification
                actions:
                  - action: OPEN_DOOR_NOW
                    title: "{{ notif_action_title }}"

      # ── Someone left home ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'left_home' }}"
        sequence:
          # Dismiss the arrival notification only for the person who left
          - action: script.notify_people
            data:
              persons:
                - "{{ triggered_person }}"
              message: "clear_notification"
              data:
                tag: door_arrival_notification

          # Start the auto-lock timer only when all people are now away
          - if:
              - condition: template
                value_template: "{{ all_away | bool }}"
            then:
              - delay:
                  minutes: "{{ lock_delay | int }}"

              # Re-check: only lock if everyone is still away after the delay
              - variables:
                  still_all_away: >
                    {% set ns = namespace(away=true) %}
                    {% for p in people %}
                      {% if is_state(p, 'home') %}
                        {% set ns.away = false %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.away }}

              - if:
                  - condition: template
                    value_template: "{{ still_all_away | bool }}"
                then:
                  - action: lock.lock
                    target:
                      entity_id: "{{ lock_entity }}"

      # ── Night mode started – lock the door ───────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'night_mode_start' and night_mode_enabled }}"
        sequence:
          - action: lock.lock
            target:
              entity_id: "{{ lock_entity }}"

      # ── Night mode ended – unlock if someone is home ──────────────────────
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'night_mode_end' and night_mode_enabled and not (all_away | bool) }}"
        sequence:
          - action: lock.unlock
            target:
              entity_id: "{{ lock_entity }}"

      # ── "Open Door" button tapped in notification ────────────────────────
      # Handled as an event trigger so it works at any time, including after
      # a Home Assistant restart (no wait_for_trigger state to lose).
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'open_door_action' }}"
        sequence:
          - action: lock.open
            target:
              entity_id: "{{ lock_entity }}"

mode: restart
max_exceeded: silent
