blueprint:
  name: "Presence & TV Room Lighting"
  description: >
    Non-blocking, event-driven room lighting that combines presence zones and
    TV state. Every state transition is driven by a real HA event — no
    blocking wait loops inside the automation.

    Before using this blueprint, create two Timer helpers
    (Settings → Devices & Services → Helpers → Add Helper → Timer).
    Their names are free-form; you select them as inputs below.

    • Motion detected → dim scene on; ramp-up timer started.
    • Ramp-up timer finishes with presence → bright scene (day or night).
    • New motion at any time → extends / resets the ramp-up timer; returns
      from wind-down to dim + restarts the timer automatically.
    • TV starts playing (while bright) → TV scene activated.
    • Couch left while TV playing → TV paused, bright scene restored.
    • TV pauses / stops while in TV mode → bright scene restored.
    • All presence clears → dim scene on, TV paused; ramp-up timer reused
      as the wind-down dim timer.
    • Wind-down timer finishes with no presence → off-wait timer started.
    • Off-wait timer finishes → lights turned off with transition.

    TV entity and couch sensor are both optional and can be left empty.
  homeassistant:
    min_version: 2023.8.0
  domain: automation
  source_url: https://github.com/l0rdsami/ha-blueprint-automation/blob/main/presence_tv_light.yaml

  input:
    presence_sensors:
      name: Presence / Motion Sensors
      description: >
        One or more presence or motion binary sensors (or groups). Any sensor
        switching to 'on' starts or restarts the lighting cycle.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - motion
            - domain: group
          multiple: true

    couch_sensor:
      name: Couch Presence Sensor (optional)
      description: >
        Presence sensor for the couch / sofa zone. Only used while TV mode is
        already active. Leaving the couch exits TV mode and pauses the TV.
        Leave empty to skip the couch check entirely (TV mode exits only when
        the TV stops or all presence clears).
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - motion
          multiple: false

    tv_entity:
      name: TV / Media Player (optional)
      description: >
        Media player entity for the room. TV mode is entered when the player
        reaches 'playing' state. Leave empty to disable TV mode entirely.
      default: ""
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: false

    dim_scene:
      name: Dim Scene
      description: >
        Scene for initial / dim lighting. Activated immediately on motion and
        again during wind-down. All light entities listed in this scene are
        used to determine which lights to turn off at the end of the cycle.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    bright_day_scene:
      name: Bright Day Scene
      description: >
        Scene for full-brightness lighting during daytime hours. Activated
        once presence has been sustained for the ramp-up dwell time and the
        current time falls within the day window.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    bright_night_scene:
      name: Bright Night Scene
      description: >
        Scene for full-brightness lighting during nighttime hours. Activated
        once presence has been sustained for the ramp-up dwell time and the
        current time is outside the day window.
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    tv_scene:
      name: TV Scene (optional)
      description: >
        Scene activated when TV mode is entered. Leave empty to keep the
        current bright scene during TV playback.
      default: ""
      selector:
        entity:
          filter:
            - domain: scene
          multiple: false

    ramp_up_timer:
      name: Ramp-up / Wind-down Timer
      description: >
        A Timer helper used for the dim → bright ramp-up delay and, when
        presence clears, for the wind-down dim phase (same duration).
        Create it via Settings → Helpers → Add Helper → Timer. The duration
        configured below is passed to the timer each time it is started, so
        the helper's own default duration does not matter.
      selector:
        entity:
          filter:
            - domain: timer
          multiple: false

    off_wait_timer:
      name: Off-wait Timer
      description: >
        A Timer helper used for the final off-wait phase after presence
        clears and the wind-down dim phase ends. Create it via Settings →
        Helpers → Add Helper → Timer.
      selector:
        entity:
          filter:
            - domain: timer
          multiple: false

    ramp_up_wait:
      name: Ramp-up Dwell Time (seconds)
      description: >
        How long presence must be continuously detected before lights transition
        from dim to bright. The same duration is reused as the dim phase during
        wind-down before the off-wait begins.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: slider
          step: 1

    ramp_up_transition:
      name: Ramp-up Transition Time (seconds)
      description: >
        Transition duration when switching from dim to bright (and when
        returning from TV mode to bright).
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: slider
          step: 1

    off_wait:
      name: Off Wait Time (seconds)
      description: >
        Additional time to stay in dim mode after the wind-down dim phase
        elapses before turning the lights off.
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: slider
          step: 1

    off_transition:
      name: Turn-off Transition Time (seconds)
      description: >
        Transition duration when turning the lights off.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
          mode: slider
          step: 1

    day_start:
      name: Day Mode Start Time
      description: >
        Start of the daytime window. The bright day scene is used between this
        time and the day mode end time. Set start later than end for an
        overnight day window (e.g. 20:00 → 06:00).
      default: "07:00:00"
      selector:
        time: {}

    day_end:
      name: Day Mode End Time
      description: >
        End of the daytime window. The bright night scene is used outside
        this window.
      default: "22:00:00"
      selector:
        time: {}

variables:
  presence_sensors: !input presence_sensors
  tv_entity: !input tv_entity
  couch_sensor: !input couch_sensor
  dim_scene: !input dim_scene
  bright_day_scene: !input bright_day_scene
  bright_night_scene: !input bright_night_scene
  tv_scene: !input tv_scene
  day_start: !input day_start
  day_end: !input day_end
  ramp_up_timer: !input ramp_up_timer
  off_wait_timer: !input off_wait_timer

trigger:
  # Any presence sensor becomes active
  - platform: state
    entity_id: !input presence_sensors
    to: 'on'
    id: motion_on

  # All presence sensors have been off for 2 s (debounced)
  - platform: template
    value_template: >
      {% set ns = namespace(all_off=true) %}
      {% for e in presence_sensors %}
        {% if is_state(e, 'on') %}{% set ns.all_off = false %}{% endif %}
      {% endfor %}
      {{ ns.all_off }}
    for:
      seconds: 2
    id: all_presence_off

  # TV starts playing
  - platform: state
    entity_id: !input tv_entity
    to: 'playing'
    id: tv_started

  # TV stops / pauses (leaves 'playing')
  - platform: state
    entity_id: !input tv_entity
    from: 'playing'
    id: tv_stopped

  # Couch sensor reports unoccupied
  - platform: state
    entity_id: !input couch_sensor
    to: 'off'
    id: couch_left

  # Ramp-up timer (also used as wind-down dim timer) expires
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input ramp_up_timer
    id: ramp_up_done

  # Off-wait timer expires → time to turn the lights off
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input off_wait_timer
    id: off_wait_done

condition: []

action:
  # Compute shared runtime values once so every branch can reference them.
  - variables:
      any_presence_on: >
        {% set ns = namespace(any_on=false) %}
        {% for e in presence_sensors %}
          {% if is_state(e, 'on') %}{% set ns.any_on = true %}{% endif %}
        {% endfor %}
        {{ ns.any_on }}
      lights_on: >
        {% set lights = (state_attr(dim_scene, 'entity_id') | default([]))
           | select('match', '^light\.') | list %}
        {{ lights | map('states') | select('eq', 'on') | list | length > 0 }}
      bright_scene: >
        {%- set t = now().strftime('%H:%M:%S') -%}
        {%- if day_start <= day_end -%}
          {%- if t >= day_start and t < day_end -%}{{ bright_day_scene }}{%- else -%}{{ bright_night_scene }}{%- endif -%}
        {%- else -%}
          {%- if t >= day_start or t < day_end -%}{{ bright_day_scene }}{%- else -%}{{ bright_night_scene }}{%- endif -%}
        {%- endif -%}

  - choose:

    # ── MOTION ON ──────────────────────────────────────────────────────────────
    # New presence detected. Behaviour depends on which phase we are in, inferred
    # from which timer is currently active.
    - conditions:
        - condition: trigger
          id: motion_on
      sequence:
        - choose:
          # Off-wait phase → cancel off timer, re-enter dim and restart ramp-up
          - conditions:
              - condition: template
                value_template: "{{ is_state(off_wait_timer, 'active') }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: !input off_wait_timer
              - action: scene.turn_on
                target:
                  entity_id: !input dim_scene
              - action: timer.start
                target:
                  entity_id: !input ramp_up_timer
                data:
                  duration: !input ramp_up_wait

          # Ramp-up or wind-down dim phase → extend the running timer
          - conditions:
              - condition: template
                value_template: "{{ is_state(ramp_up_timer, 'active') }}"
            sequence:
              - action: timer.start
                target:
                  entity_id: !input ramp_up_timer
                data:
                  duration: !input ramp_up_wait

          # Idle (no timers, lights off) → start a fresh dim cycle
          - conditions:
              - condition: template
                value_template: "{{ not lights_on }}"
            sequence:
              - action: scene.turn_on
                target:
                  entity_id: !input dim_scene
              - action: timer.start
                target:
                  entity_id: !input ramp_up_timer
                data:
                  duration: !input ramp_up_wait

          # Bright / TV mode → already lit, nothing to change

    # ── ALL PRESENCE OFF ───────────────────────────────────────────────────────
    # Guard: only act when the automation is in an active cycle (lights on or
    # ramp-up timer running). This prevents spurious firing at HA startup.
    - conditions:
        - condition: trigger
          id: all_presence_off
        - condition: template
          value_template: "{{ lights_on or is_state(ramp_up_timer, 'active') }}"
      sequence:
        - choose:
          # Still in the initial dim / ramp-up phase → reuse the same timer as
          # the wind-down dim timer (dim scene already active, no scene change)
          - conditions:
              - condition: template
                value_template: "{{ is_state(ramp_up_timer, 'active') }}"
            sequence:
              - action: timer.start
                target:
                  entity_id: !input ramp_up_timer
                data:
                  duration: !input ramp_up_wait

          # Bright or TV mode → switch to dim, pause TV, start wind-down timer
          default:
            - action: scene.turn_on
              target:
                entity_id: !input dim_scene
              data:
                transition: !input ramp_up_transition
            - if:
                - condition: template
                  value_template: "{{ tv_entity != '' and is_state(tv_entity, 'playing') }}"
              then:
                - action: media_player.media_pause
                  target:
                    entity_id: !input tv_entity
            - action: timer.start
              target:
                entity_id: !input ramp_up_timer
              data:
                duration: !input ramp_up_wait

    # ── RAMP-UP / WIND-DOWN DIM TIMER DONE ────────────────────────────────────
    - conditions:
        - condition: trigger
          id: ramp_up_done
      sequence:
        - choose:
          # Presence still active → ramp-up dwell satisfied, go bright
          - conditions:
              - condition: template
                value_template: "{{ any_presence_on }}"
            sequence:
              - action: scene.turn_on
                target:
                  entity_id: "{{ bright_scene }}"
                data:
                  transition: !input ramp_up_transition

          # No presence → wind-down dim phase complete, start off-wait
          default:
            - action: timer.start
              target:
                entity_id: !input off_wait_timer
              data:
                duration: !input off_wait

    # ── TV STARTED ─────────────────────────────────────────────────────────────
    # Only enter TV mode while we are in bright mode (no timer running, lights on)
    - conditions:
        - condition: trigger
          id: tv_started
        - condition: template
          value_template: >
            {{ not is_state(ramp_up_timer, 'active')
               and not is_state(off_wait_timer, 'active')
               and lights_on }}
      sequence:
        - if:
            - condition: template
              value_template: "{{ tv_scene != '' }}"
          then:
            - action: scene.turn_on
              target:
                entity_id: !input tv_scene

    # ── TV STOPPED ─────────────────────────────────────────────────────────────
    # TV left 'playing' while in bright/TV mode → restore the bright scene
    - conditions:
        - condition: trigger
          id: tv_stopped
        - condition: template
          value_template: >
            {{ not is_state(ramp_up_timer, 'active')
               and not is_state(off_wait_timer, 'active')
               and lights_on }}
      sequence:
        - action: scene.turn_on
          target:
            entity_id: "{{ bright_scene }}"
          data:
            transition: !input ramp_up_transition

    # ── COUCH LEFT ─────────────────────────────────────────────────────────────
    # Only act if the TV is actually playing (i.e. we are in TV mode)
    - conditions:
        - condition: trigger
          id: couch_left
        - condition: template
          value_template: "{{ tv_entity != '' and is_state(tv_entity, 'playing') }}"
      sequence:
        - action: media_player.media_pause
          target:
            entity_id: !input tv_entity
        - action: scene.turn_on
          target:
            entity_id: "{{ bright_scene }}"
          data:
            transition: !input ramp_up_transition

    # ── OFF-WAIT TIMER DONE → LIGHTS OFF ──────────────────────────────────────
    - conditions:
        - condition: trigger
          id: off_wait_done
      sequence:
        - action: light.turn_off
          target:
            entity_id: >
              {{ (state_attr(dim_scene, 'entity_id') | default([]))
                 | select('match', '^light\.')
                 | list }}
          data:
            transition: !input off_transition

mode: parallel
max_exceeded: silent
